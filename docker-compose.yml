services:
  redis:
    image: redis:alpine
    container_name: snapresize-redis
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: quay.io/minio/minio:latest
    container_name: snapresize-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    restart: always

  backend:
    build: ./backend
    container_name: snapresize-backend
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - REDIS_HOST=redis
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=snapresize-bucket
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - redis
      - minio
    restart: always

  frontend:
    build: ./frontend
    container_name: snapresize-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always